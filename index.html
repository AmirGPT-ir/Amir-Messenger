<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
body {
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}
#chat {
    width: 90%;
    max-width: 600px;
    margin: auto;
    margin-top: 20px;
}
input, button {
    padding: 10px;
    margin: 5px;
}
.message {
    background: #1e293b;
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
}
</style>
</head>
<body>

<h2>Secure Messenger 🔐</h2>

<input id="username" placeholder="نام شما">
<br>
<input id="messageInput" placeholder="پیام بنویس...">
<button onclick="sendMessage()">ارسال</button>

<div id="chat"></div>

<script>
const BACKEND_URL = "https://YOUR-APP.chabokan.net"; // 👈 اینو بعدا عوض میکنی

const SECRET_KEY = "SUPER_SECRET_KEY_123"; // کلید رمز

async function sendMessage() {
    const username = document.getElementById("username").value;
    const message = document.getElementById("messageInput").value;

    if (!username || !message) return alert("همه فیلدها رو پر کن");

    const encrypted = CryptoJS.AES.encrypt(message, SECRET_KEY).toString();

    await fetch(BACKEND_URL + "/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            sender: username,
            content: encrypted
        })
    });

    document.getElementById("messageInput").value = "";
    loadMessages();
}

async function loadMessages() {
    const res = await fetch(BACKEND_URL + "/messages");
    const data = await res.json();

    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    data.forEach(msg => {
        const decrypted = CryptoJS.AES.decrypt(msg.content, SECRET_KEY)
            .toString(CryptoJS.enc.Utf8);

        const div = document.createElement("div");
        div.className = "message";
        div.innerText = msg.sender + ": " + decrypted;
        chat.appendChild(div);
    });
}

setInterval(loadMessages, 3000);
</script>

</body>
</html>
